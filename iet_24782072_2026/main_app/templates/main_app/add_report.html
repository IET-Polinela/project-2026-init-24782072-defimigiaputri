{% extends 'base.html' %}

{% block content %}

<div class="container-box">

    <div style="text-align:center;">
        <h2 class="title-badge">Tambah Laporan</h2>
    </div>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary"
            onclick="this.innerText='Loading...'; setTimeout(() => this.disabled=true, 100);">
            Simpan
        </button>
        </div>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'report_list' %}" class="btn-back">Kembali</a>
    </div>

</div>

<script>
document.querySelector("form").addEventListener("submit", function (e) {
    e.preventDefault();

    const btn = this.querySelector("button[type='submit']");
    btn.innerText = "Loading...";
    btn.disabled = true;

    setTimeout(() => {
        this.submit();
    }, 5000);
});
</script>

{% endblock %}
