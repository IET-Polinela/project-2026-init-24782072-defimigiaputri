{% extends 'base.html' %}

{% block content %}

<div class="container-box">
    <div style="text-align:center;">
    <h2 class="title-badge">Konfirmasi Hapus</h2>
</div>

    <p>Apakah yakin ingin menghapus:</p>
    <b>{{ report.title }}</b>

    <form method="POST">
        {% csrf_token %}
        <br>
        <button type="submit" class="btn btn-danger">Ya, Hapus</button>
    </form>

    <br>
    <a href="{% url 'report_list' %}" class="btn-custom">Kembali</a>
</div>

{% endblock %}
