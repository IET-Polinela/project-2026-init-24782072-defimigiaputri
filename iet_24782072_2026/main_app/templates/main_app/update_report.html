<!DOCTYPE html>
<html>
<head>
    <title>Edit Laporan</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            margin: 0;
            background: linear-gradient(to right, #ffe5d9, #ffd6cc);
        }

          .header {
            background-color: #d88c9a;
            color: white;
            text-align: center;
            padding: 15px;
            font-family: Georgia, serif;
            font-size: 20px;
        }

        .navbar {
            background-color: #f4b6b2;
            text-align: center;
            padding: 10px;
            font-size: 17px;
        }

        .navbar a {
            margin: 0 25px;
            text-decoration: none;
            color: #6d4c41;
            font-weight: bold;
        }

        .container {
            width: 60%;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            font-family: Georgia, serif;
            color: #6d4c41;
        }

        .title {
            color: #c06c84;
            font-family: Georgia, serif;
        }

        .actions a {
            background-color: #f8b4a9;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            text-decoration: none;
            margin-left: 5px;
        }

        .actions a:hover {
            background-color: #f4978e;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            background-color: #f8b4a9;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
        }

        .back:hover {
            background-color: #f4978e;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background-color: #f4b6b2;
            margin-top: 50px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="header">
        Smart City Issue Reporting Lampung
    </div>

<div class="navbar">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'contacts' %}">Contact</a>
</div>

<div class="container">
    <h2>Edit Laporan</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update</button>
    </form>

    <a href="{% url 'report_list' %}" class="back">Kembali ke Daftar Laporan</a>

</div>

<div class="footer">
    © 2026 Pemrograman Internet 1 (1416)<br>
    @_mgiaa.dv
</div>

</body>
</html>
