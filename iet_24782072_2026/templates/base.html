<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart City{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Times New Roman", serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #ffe5d9, #fff1ed);
        }

        .header {
            background-color: #d88c9a;
            color: white;
            text-align: center;
            padding: 15px;
            font-family: Georgia, serif;
            font-size: 22px;
        }

        .navbar-custom {
            background-color: #f4b6b2;
            text-align: center;
            padding: 10px;
        }

        .navbar-custom a {
            margin: 0 25px;
            text-decoration: none;
            color: #6d4c41;
            font-weight: bold;
        }

        .navbar-custom a:hover {
            text-decoration: underline;
        }

        .container-box {
            width: 60%;
            margin: 50px auto;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #c06c84;
            font-family: Georgia, serif;
        }

        .btn-custom {
            display: inline-block;
            margin-top: 20px;
            background-color: #f8b4a9;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
        }

        .btn-custom:hover {
            background-color: #f4978e;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background-color: #f4b6b2;
            margin-top: 50px;
        }

        .page-title {
            background-color: #d88c9a;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 22px;
            font-family: Georgia, serif;
            text-align: center;
            margin-bottom: 20px;
        }

        .title-badge {
             display: inline-block;
            background-color: #f18d9f;
            color: white;
            padding: 10px 25px;
            border-radius: 12px;
            font-family: Georgia, serif;
            font-size: 24px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background-color: #f8b4a9;
            border-color: #f8b4a9;
            color: white;
        }

        .btn-primary:hover {
            background-color: #f4978e;
            border-color: #f4978e;
        }

        .btn-success {
            background-color: #f4b6b2;
            border-color: #f4b6b2;
            color: white;
        }

        .btn-warning {
            background-color: #ffd6cc;
            border-color: #ffd6cc;
            color: #6d4c41;
        }

        .btn-danger {
            background-color: #d88c9a;
            border-color: #d88c9a;
            color: white;
        }

        .badge-reported {
            background-color: #ffd6cc;
            color: #e1957c;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .badge-verified {
            background-color: #f8b4a9;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .badge-progress {
            background-color: #f4978e;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .badge-resolved {
            background-color: #f18d9f;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="header">
    Smart City Issue Reporting Lampung
</div>

<div class="navbar-custom">
    <a href="{% url 'home' %}" class="{% if request.path == '/' %}active{% endif %}">Home</a>
    <a href="{% url 'about' %}" class="{% if request.path == '/about/' %}active{% endif %}">About</a>
    <a href="{% url 'contacts' %}" class="{% if request.path == '/contacts/' %}active{% endif %}">Contact</a>
    <a href="{% url 'report_list' %}" class="{% if '/reports' in request.path %}active{% endif %}">Reports</a>
</div>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<div class="footer">
    © 2026 Pemrograman Internet 1 (1416)<br>
    @_mgiaa.dv
</div>

</body>
</html>
