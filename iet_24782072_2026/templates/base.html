<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart City{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Times New Roman", serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #ffe5d9, #fff1ed);
        }

        .header {
            background-color: #d88c9a;
            color: white;
            text-align: center;
            padding: 15px;
            font-family: Georgia, serif;
            font-size: 22px;
        }

        .navbar-custom {
            background-color: #f4b6b2;
            text-align: center;
            padding: 10px;
        }

        .navbar-custom a {
            margin: 0 25px;
            text-decoration: none;
            color: #6d4c41;
            font-weight: bold;
            transition: 0.3s;
        }

        .navbar-custom a.active {
            border-bottom: 2px solid #6d4c41;
        }

        .navbar-custom a:hover {
            opacity: 0.7;
        }

        .container-box {
            width: 60%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
        }

        .home-title {
            font-size: 36px;
            font-family: Georgia, serif;
            color: #c06c84;
            text-align: center;
            font-weight: bold;
        }

        .navbar-custom a.active {
            border-bottom: 3px solid #6d4c41;
            padding-bottom: 3px;
        }

        .title-badge {
            display: inline-block;
            background-color: #f18d9f;
            color: white;
            padding: 10px 25px;
            border-radius: 12px;
            font-family: Georgia, serif;
            font-size: 24px;
            transition: 0.3s;
        }

        .btn-custom {
            background-color: #f8b4a9;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background-color: #f4978e;
        }

        .btn {
            transition: all 0.2s ease-in-out;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary,
        .btn-primary:focus,
        .btn-primary:active {
            background-color: #f8b4a9 !important;
            border-color: #f8b4a9 !important;
            color: white !important;
            box-shadow: none !important;
        }

        .btn-primary:hover {
            background-color: #f4978e !important;
        }

        .btn-warning,
        .btn-warning:focus,
        .btn-warning:active {
            background-color: #ffd6cc !important;
            border-color: #ffd6cc !important;
            color: #6d4c41 !important;
            box-shadow: none !important;
        }

        .btn-warning:hover {
            background-color: #f8b4a9 !important;
        }

        .btn-success,
        .btn-success:focus,
        .btn-success:active {
            background-color: #f4b6b2 !important;
            border-color: #f4b6b2 !important;
            color: white !important;
            box-shadow: none !important;
        }

        .btn-success:hover {
            background-color: #e5989b !important;
        }

        .btn-danger,
        .btn-danger:focus,
        .btn-danger:active {
            background-color: #d88c9a !important;
            border-color: #d88c9a !important;
            color: white !important;
            box-shadow: none !important;
        }

        .btn-danger:hover {
            background-color: #c06c84 !important;
        }

        .badge-reported {
            background-color: #ffd6cc;
            color: #e1957c;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .badge-verified {
            background-color: #f8b4a9;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .badge-progress {
            background-color: #f4978e;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .badge-resolved {
            background-color: #f18d9f;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .badge-reported,
        .badge-verified,
        .badge-progress,
        .badge-resolved {
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: 500;
        }

        .badge-reported:hover,
        .badge-verified:hover,
        .badge-progress:hover,
        .badge-resolved:hover {
            opacity: 0.85;
        }

        .table {
            border-radius: 10px;
            overflow: hidden;
        }

        input, textarea, select {
            border-radius: 8px;
            padding: 8px;
            border: 1px solid #ddd;
            width: 100%;
        }

        @media (max-width: 768px) {
            .container-box {
                width: 90%;
            }
        }

        .footer {
            text-align: center;
            padding: 15px;
            background-color: #f4b6b2;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<div class="header">
    Smart City Issue Reporting Lampung
</div>

<div class="navbar-custom">
    <a href="{% url 'home' %}" class="{% if request.path == '/' %}active{% endif %}">Home</a>
    <a href="{% url 'about' %}" class="{% if request.path == '/about/' %}active{% endif %}">About</a>
    <a href="{% url 'contacts' %}" class="{% if request.path == '/contacts/' %}active{% endif %}">Contact</a>
    <a href="{% url 'report_list' %}" class="{% if '/reports' in request.path %}active{% endif %}">Reports</a>
</div>

<div class="container mt-3">
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}
</div>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<div class="footer">
    © 2026 Pemrograman Internet 1 (1416)<br>
    @_mgiaa.dv
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
